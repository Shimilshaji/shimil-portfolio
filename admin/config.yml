# Replace REPLACE_WITH_TURBO_SITE_ID with the Site ID from Decap Turbo > Overview.
backend:
  name: turbo-github
  turbo_site_id: REPLACE_WITH_TURBO_SITE_ID
  branch: main

site_url: https://shimilshaji.github.io/shimil-portfolio
display_url: https://shimilshaji.github.io/shimil-portfolio
media_folder: assets/blog
public_folder: assets/blog
publish_mode: simple

collections:
  - name: blog
    label: Blog
    files:
      - name: posts
        label: Articles
        file: posts.json
        fields:
          - name: posts
            label: Articles
            widget: list
            summary: '{{fields.title}}'
            fields:
              - name: title
                label: Article title
                widget: string
              - name: seoTitle
                label: SEO title
                widget: string
                required: false
              - name: metaDescription
                label: Meta description
                widget: text
                required: false
              - name: focusKeyword
                label: Focus keyword
                widget: string
                required: false
              - name: slug
                label: URL slug
                widget: string
                pattern:
                  - '^[a-z0-9]+(?:-[a-z0-9]+)*$'
                  - Use lowercase letters, numbers, and hyphens only.
              - name: featuredImage
                label: Featured image
                widget: image
                required: false
              - name: excerpt
                label: Short excerpt
                widget: text
                required: false
              - name: date
                label: Publish date
                widget: datetime
              - name: body
                label: Article text
                widget: text
